# SiteFlow — Nginx
# Un seul bloc "attrape-tout" : n'importe quel domaine pointé vers ce serveur
# arrive sur l'application, qui choisit le site à afficher selon le domaine.
# Les certificats HTTPS sont ajoutés domaine par domaine avec deploy/add-domain.sh (certbot).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _ __STUDIO_DOMAIN__;

    client_max_body_size 60m;

    # Cache long pour les fichiers statiques Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
